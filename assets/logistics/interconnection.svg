<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940"><rect width="1200" height="940" fill="#fff"/><g font-family="Arial,Noto Sans KR,sans-serif"><text x="40" y="48" fill="#18334c" font-size="28" font-weight="700" text-anchor="start">거점 간 연동 | IPsec VPN · 업무 API</text><text x="40" y="80" fill="#567087" font-size="16" font-weight="400" text-anchor="start">본사 ERP / 서비스 DC / 물류 DC는 각각 독립된 네트워크입니다.</text><rect x="30" y="115" width="1140" height="220" rx="8" fill="#f0f6f7" stroke="#cbd6e2"/><text x="50" y="149" fill="#18334c" font-size="21" font-weight="600" text-anchor="start">01  본사 ↔ 물류 DC : IPsec VPN (con2)</text><rect x="60" y="183" width="300" height="95" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="210.0" y="209" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">본사 ERP-WEB</text><text x="210.0" y="232" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">10.14.90.14</text><rect x="450" y="183" width="300" height="95" rx="8" fill="#eaf5f6" stroke="#b7c9d7"/><text x="600.0" y="209" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">IPsec VPN / pfSense</text><text x="600.0" y="232" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">거점 간 내부 주소 통신</text><rect x="840" y="183" width="300" height="95" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="990.0" y="209" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">물류 WEB / WAF</text><text x="990.0" y="232" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">10.20.20.10 : 80</text><path d="M360 230L450 230" stroke="#247189" stroke-width="2" fill="none"/><path d="M750 230L840 230" stroke="#247189" stroke-width="2" fill="none"/><text x="60" y="313" fill="#18334c" font-size="17" font-weight="400" text-anchor="start">HTTP는 VPN 내부로 전달 · /integration/v1/* · ERP 전용 X-Service-Key</text><rect x="30" y="365" width="1140" height="245" rx="8" fill="#f5f8fc" stroke="#cbd6e2"/><text x="50" y="400" fill="#18334c" font-size="21" font-weight="600" text-anchor="start">02  서비스 DC → 물류 WMS : 재고 예약·해제·배송 조회</text><rect x="60" y="440" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="210.0" y="466" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">서비스 DC</text><text x="210.0" y="489" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">주문·쇼핑몰 API</text><rect x="450" y="440" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="600.0" y="466" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">물류 WEB / WAF</text><text x="600.0" y="489" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">10.20.20.10 : 80</text><rect x="840" y="440" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="990.0" y="466" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">WMS / WAS</text><text x="990.0" y="489" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">10.20.30.10</text><path d="M360 485L450 485" stroke="#247189" stroke-width="2" fill="none"/><path d="M750 485L840 485" stroke="#247189" stroke-width="2" fill="none"/><text x="60" y="568" fill="#18334c" font-size="16" font-weight="400" text-anchor="start">/api/inventory/{sku} · /api/orders/reserve · /api/orders/release · /api/orders/{id}/shipping</text><text x="60" y="593" fill="#567087" font-size="15" font-weight="400" text-anchor="start">호출 권한: WMS_KEY에 대응하는 서비스 DC 전용 키</text><rect x="30" y="640" width="1140" height="245" rx="8" fill="#f5f8fc" stroke="#cbd6e2"/><text x="50" y="675" fill="#18334c" font-size="21" font-weight="600" text-anchor="start">03  물류 WMS → 서비스 DC : 주문 확인·출고 승인</text><rect x="60" y="715" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="210.0" y="741" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">물류 WMS / WAS</text><text x="210.0" y="764" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">SERVICE_API_URL 설정</text><rect x="450" y="715" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="600.0" y="741" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">서버 간 API</text><text x="600.0" y="764" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">X-Service-Key / WMS_SERVICE_KEY</text><rect x="840" y="715" width="300" height="90" rx="8" fill="#fff" stroke="#b7c9d7"/><text x="990.0" y="741" fill="#18334c" font-size="17" font-weight="600" text-anchor="middle">서비스 DC API</text><text x="990.0" y="764" fill="#567087" font-size="14" font-weight="400" text-anchor="middle">10.10.40.10 : 3000</text><path d="M360 760L450 760" stroke="#247189" stroke-width="2" fill="none"/><path d="M750 760L840 760" stroke="#247189" stroke-width="2" fill="none"/><text x="60" y="843" fill="#18334c" font-size="17" font-weight="400" text-anchor="start">/api/integration/v1/orders/{id} · /api/integration/v1/orders/{id}/dispatch</text><text x="60" y="870" fill="#567087" font-size="15" font-weight="400" text-anchor="start">팀에서 공유한 추가 API 노드: 10.10.40.11:3000 / 10.10.40.12:3000</text><text x="40" y="920" fill="#567087" font-size="15" font-weight="400" text-anchor="start">화살표 배치는 요청 방향을 설명합니다. API 키 값·VPN 공유키는 공개 문서에 포함하지 않습니다.</text></g></svg>